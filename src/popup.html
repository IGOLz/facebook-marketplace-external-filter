<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" width="32" height="32" alt="">
    <h1 data-i18n="extName"></h1>
  </header>

  <label class="row">
    <span data-i18n="enabledLabel"></span>
    <input type="checkbox" id="enabled" class="switch">
  </label>

  <fieldset id="mode" class="segmented">
    <label><input type="radio" name="mode" value="hide"><span data-i18n="modeHide"></span></label>
    <label><input type="radio" name="mode" value="dim"><span data-i18n="modeDim"></span></label>
  </fieldset>

  <p id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
